# jlmush-edge — the Worker that sits in front of Cloudflare Pages.
#
# Tenant Custom Hostnames (managed by ``Backend/app/services/cloudflare_saas.py``)
# point their ``custom_origin_server`` at this Worker's ``*.workers.dev``
# hostname. The Worker fetches static assets from the
# ``jlmushiitm-frontend`` Pages project via the ``ASSETS`` binding.
#
# Keeping the Worker on the data path from day one — even as a
# transparent pass-through — means future tenant-host middleware,
# maintenance modes, or edge WAF rules are a code change, not a
# re-routing of every tenant Custom Hostname.
name = "jlmush-edge"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Bind the Pages project's static assets so the Worker can call
# ``env.ASSETS.fetch(request)`` and serve the SPA without an HTTP
# round-trip out of the Cloudflare edge.
#
# Note: this is a single ``[assets]`` table, NOT ``[[assets]]`` —
# wrangler interprets array-of-tables as multiple assets configs and
# fails with "Unexpected fields found in assets field: 0".
[assets]
binding = "ASSETS"
# Wrangler uploads everything under this directory to the Worker. The
# CI build runs ``npm run build`` in ``Frontend/`` first, which writes
# the SPA bundle to ``Frontend/dist`` — same artifact Pages serves.
directory = "../dist"
# SPA fallback: serve index.html (with 200) for any path that doesn't
# match a file in dist/. Without this, deep links like
# `<slug>.larazen.in/dashboard/admin` 404 because the Worker looks for
# a literal file at /dashboard/admin which doesn't exist. React Router
# can only run if index.html actually gets returned for those paths.
not_found_handling = "single-page-application"

# Wildcard route: every <slug>.jlmush.in request hits this Worker.
# Universal SSL on the zone covers *.jlmush.in for free, so no per-
# subdomain cert work is needed. The Worker reads ASSETS and serves
# the SPA — same artifact Pages serves, but routed via Worker so
# Pages' Host-header binding check doesn't reject unknown subdomains
# (which was the post-Amplify-migration regression).
#
# This was *.larazen.in until the one-domain cutover (2026-08-20).
# Production is now the greenfield jlmush.in stack; larazen.in and its
# tenants belong to the OLD stack, which becomes TEST — so that route
# moved to [env.test] below rather than staying here, where it would
# have pointed live larazen tenants at the new, empty prod backend.
[[routes]]
pattern = "*.jlmush.in/*"
zone_name = "jlmush.in"

# --- TEST environment (wrangler deploy --env test) --------------------
# Separate Worker on the dedicated TEST domain's zone — the test env
# never routes through the larazen.in zone. Deployed by deploy.yml
# (the test workflow) against the testing-mode build in ../dist.
#
# The test domain (jucf.org) also appears in .env.testing and the infra
# repo's envs/test/terraform.tfvars — change all three together.
#
# Routes and assets are NOT inherited across wrangler environments, so
# both are declared explicitly.
#
# larazen.in tenant hosts (<slug>.larazen.in) ARE served by this worker,
# but their route is NOT declared here on purpose. The zone-side route
# (`*.larazen.in/*` -> jlmush-edge-test, plus the `api.larazen.in/*`
# script:null exclusion) already exists and is stable; declaring it here
# makes every deploy re-assert it, which requires the CI token to hold
# Workers-Routes Edit on the larazen.in zone. The deploy token is scoped
# to jucf.org by design — the test pipeline should not carry write
# access to a customer tenant's zone just to re-state existing routing.
# If the larazen.in routes ever need changing, do it once in the
# Cloudflare dashboard (or with a properly scoped one-off token).
[env.test]
name = "jlmush-edge-test"
routes = [
  { pattern = "*.jucf.org/*", zone_name = "jucf.org" },
]

[env.test.assets]
binding = "ASSETS"
directory = "../dist"
not_found_handling = "single-page-application"
