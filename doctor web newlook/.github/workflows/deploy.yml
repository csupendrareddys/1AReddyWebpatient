# Deploys the SPA to BOTH targets on push to main:
#   1. ``jlmushfrontend`` Pages project — serves external tenant custom
#      domains (e.g. ``www.vedanthzen.com``) via Cloudflare Pages
#      Custom Domains, which the backend binds via the Pages API.
#   2. ``jlmush-edge`` Worker — serves ``www.larazen.in`` (Custom
#      Domain) and ``*.larazen.in`` tenant subdomains (wildcard Route).
#
# Both surfaces serve the SAME ``dist/`` artifact, built once at the
# top of this job. Deploying both in lockstep prevents the
# asset-hash drift problem (HTML on one surface referencing JS hash
# only present on the other).
#
# Before adding this, ``jlmushfrontend`` was deployed via CF dashboard's
# built-in Git integration. Disconnect that integration once this
# workflow is green, or you'll get two builds racing each other.
#
# Required GitHub Actions secrets (Settings → Secrets and variables
# → Actions in this repo):
#
#   CLOUDFLARE_API_TOKEN   — scopes:
#                              • Account → Cloudflare Pages → Edit
#                              • Account → Workers Scripts → Edit
#                              • Zone → Workers Routes → Edit       (on the larazen.in zone, for the wildcard route binding)
#                              • Zone → DNS → Edit                  (optional; only if same token used by backend)
#   CLOUDFLARE_ACCOUNT_ID  — the account hosting the Pages project + Worker.
#
# Path filter keeps unrelated commits (docs, configs outside src) from
# burning CI minutes.

name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'worker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+ is required by ``wrangler@4`` (otherwise: "Wrangler
          # requires at least Node.js v22.0.0"). Bumped from 20 once the
          # latest wrangler dropped Node 20 support.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install SPA dependencies
        run: npm ci

      - name: Build SPA
        # Vite reads ``.env.production`` (committed) for build-time
        # env vars — VITE_API_BASE_URL etc. Writes the bundle to
        # ``./dist`` which both Pages and the Worker consume.
        run: npm run build

      - name: Deploy to Cloudflare Pages (jlmushiitmfrontend)
        # Serves external tenant custom domains (Pages Custom Domains
        # are how the backend's ``CloudflareSaasService.create_or_update``
        # binds e.g. ``www.vedanthzen.com``). Pages project name must
        # match the backend's ``CLOUDFLARE_PAGES_PROJECT_NAME`` env
        # var. Tenants are told to CNAME their domain to
        # ``<PAGES_PROJECT_NAME>.pages.dev`` (computed by the backend's
        # ``cloudflare_saas_fallback_origin`` field).
        #
        # First-time setup: create the Pages project via dashboard
        # (Workers & Pages → Create application → Pages tab → Vite
        # preset → Save & Deploy). Disconnect Git integration on the
        # project after the first deploy so CI is the sole source.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: jlmushiitmfrontend
        run: |
          npx wrangler@4.44.0 pages deploy dist \
            --project-name="$PAGES_PROJECT_NAME" \
            --branch=main \
            --commit-hash=${{ github.sha }}

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install --no-package-lock

      - name: Deploy jlmush-edge Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.44.0 deploy
