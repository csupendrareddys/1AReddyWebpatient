name: release

# Post-merge release pipeline.
# Triggers on push to `main`, which happens when a PR gets merged.
# Builds both images (with heavy cache reuse from the PR's ci.yml run)
# and pushes them to the private DockerHub repo with env-agnostic tags.
#
# Image tag scheme (one private DockerHub repo, tag prefixes):
#
#   <user>/jlmush:backend-<sha>    immutable, one per merge commit
#   <user>/jlmush:backend-main     rolling, always points at latest main
#   <user>/jlmush:redis-<sha>      immutable
#   <user>/jlmush:redis-main       rolling
#
# Secrets used: DOCKERHUB_USERNAME + DOCKERHUB_TOKEN at the REPOSITORY
# level (not environment-scoped) — these are infrastructure creds that
# apply to all environments, not per-env config.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_REPO:           ${{ secrets.DOCKERHUB_USERNAME }}/jlmush
  TAG_BACKEND_SHA:      backend-${{ github.sha }}
  TAG_BACKEND_ROLLING:  backend-main
  TAG_REDIS_SHA:        redis-${{ github.sha }}
  TAG_REDIS_ROLLING:    redis-main

jobs:
  build-and-push:
    name: build + push to DockerHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Backend ──────────────────────────────────────────────
      # cache-from matches the scope used in ci.yml, so layers from
      # the PR build are reused here. Expected: ~10s to rebuild +
      # ~30s to push. Total backend step: <1 min.
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.TAG_BACKEND_SHA }}
            ${{ env.IMAGE_REPO }}:${{ env.TAG_BACKEND_ROLLING }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # ── Redis ────────────────────────────────────────────────
      - name: Build and push redis image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.redis
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.TAG_REDIS_SHA }}
            ${{ env.IMAGE_REPO }}:${{ env.TAG_REDIS_ROLLING }}
          cache-from: type=gha,scope=redis
          cache-to: type=gha,scope=redis,mode=max

      - name: Summary
        run: |
          echo "### Release published" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pushed tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_REPO }}:${{ env.TAG_BACKEND_SHA }}\`"     >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_REPO }}:${{ env.TAG_BACKEND_ROLLING }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_REPO }}:${{ env.TAG_REDIS_SHA }}\`"       >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_REPO }}:${{ env.TAG_REDIS_ROLLING }}\`"   >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Phase 3 (EC2 deploy) will pull \`${{ env.IMAGE_REPO }}:backend-main\` and \`${{ env.IMAGE_REPO }}:redis-main\`." >> $GITHUB_STEP_SUMMARY
